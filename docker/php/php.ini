; Загрузка фото с телефона: снимок с камеры легко весит 5-8 МБ,
; а в форме товара их может быть несколько сразу.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; Ресайз в три размера через GD требует памяти на распаковку исходника.
memory_limit = 512M
max_execution_time = 120

date.timezone = Asia/Almaty
