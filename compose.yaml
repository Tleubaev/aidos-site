name: aidos

services:
  app:
    build:
      context: ./docker/php
    volumes:
      - .:/var/www/html
    environment:
      COMPOSER_MEMORY_LIMIT: "-1"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Версия ровно как на хостинге hoster.kz. Не поднимать до 10.6+ локально:
  # смысл в том, чтобы несовместимость всплыла здесь, а не после деплоя.
  db:
    image: mariadb:10.4.34
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aidos
      MYSQL_USER: aidos
      MYSQL_PASSWORD: secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 3307 снаружи, чтобы не конфликтовать с локальным MySQL, если он появится
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
